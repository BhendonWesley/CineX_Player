name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/cinex-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_FILE: cinex-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CineX-Player.apk

      - name: Generate changelog in Portuguese
        id: changelog
        working-directory: .
        run: |
          # Pega a tag anterior
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            COMMITS=$(git log --oneline -20 --pretty=format:"%s")
          else
            COMMITS=$(git log --oneline "$PREV_TAG..$CURRENT_TAG" --pretty=format:"%s")
          fi

          # Mapeia prefixos de commit para categorias em português
          FEATURES=""
          FIXES=""
          OTHERS=""

          while IFS= read -r line; do
            # Remove prefixos convencionais (feat:, fix:, etc)
            clean=$(echo "$line" | sed -E 's/^(feat|fix|chore|refactor|style|docs|perf|test|build|ci|release)(\(.+\))?[!]?:\s*//')

            # Traduz palavras comuns EN→PT
            clean=$(echo "$clean" | sed -E '
              s/\bfix\b/Correção/gi
              s/\bimplement\b/Implementação de/gi
              s/\badd\b/Adicionado/gi
              s/\bupdate\b/Atualização de/gi
              s/\bremove\b/Remoção de/gi
              s/\bimprove\b/Melhoria em/gi
              s/\brefactor\b/Refatoração de/gi
            ')

            if echo "$line" | grep -qiE "^feat"; then
              FEATURES="$FEATURES• $clean\n"
            elif echo "$line" | grep -qiE "^fix"; then
              FIXES="$FIXES• $clean\n"
            else
              OTHERS="$OTHERS• $clean\n"
            fi
          done <<< "$COMMITS"

          # Monta o body da release
          BODY=""
          if [ -n "$FEATURES" ]; then
            BODY="${BODY}🆕 Novidades\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}🐛 Correções\n${FIXES}\n"
          fi
          if [ -n "$OTHERS" ]; then
            BODY="${BODY}🔧 Outros\n${OTHERS}\n"
          fi

          # Fallback
          if [ -z "$BODY" ]; then
            BODY="• Melhorias de desempenho e correções de bugs."
          fi

          # Salva no output (multi-line)
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CineX Player ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.BODY }}
          files: deps/app/build/outputs/apk/release/CineX-Player.apk
